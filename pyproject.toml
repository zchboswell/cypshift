[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[project]
name = "cypshift"
version = "0.0.1"
description = "Series-first, competence-aware CYP inhibition prediction"
readme = "README.md"
authors = [{ name = "zchboswell" }]
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2026.3.4,<2027",
]

[project.scripts]
cypshift = "cypshift.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
ignore_missing_imports = true
