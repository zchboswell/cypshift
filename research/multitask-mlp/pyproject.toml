[project]
name = "cypshift-multitask-mlp"
version = "0.0.0"
requires-python = "==3.12.3"
dependencies = [
    "numpy==2.5.2",
    "rdkit==2026.3.5",
    "torch==2.13.0+cpu",
]

[tool.uv]
exclude-newer = "2026-08-24T23:59:59Z"
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
